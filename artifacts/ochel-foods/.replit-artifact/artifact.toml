kind = "web"
previewPath = "/"
title = "O'chel Foods"
version = "1.0.0"
id = "artifacts/ochel-foods"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22151

[services.development]
run = "pnpm --filter @workspace/ochel-foods run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ochel-foods", "run", "build" ]
publicDir = "artifacts/ochel-foods/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22151"
BASE_PATH = "/"
